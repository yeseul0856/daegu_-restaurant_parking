# main 브랜치에 push 하면 EC2 로 자동 배포
#
# GitHub 저장소 Settings > Secrets and variables > Actions 에 등록할 값
#   EC2_HOST     : EC2 공인 IP (예: 13.209.xxx.xxx)
#   EC2_USER     : ubuntu
#   EC2_SSH_KEY  : EC2 키 페어(.pem) 파일 내용 전체
#
# API 키(backend/.env)는 저장소에 올리지 않고 서버에만 둔다. (최초 1회 수동 업로드)
name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DIR: /home/${{ secrets.EC2_USER }}/fastapi-parking
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: SSH 키 설정
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: 코드 업로드 (서버의 .env, data 는 유지)
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.venv/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'backend/geocode_cache*.json' \
            -e "ssh -i ~/.ssh/ec2.pem" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$APP_DIR/"

      - name: 빌드 및 재시작
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "APP_DIR=$APP_DIR bash $APP_DIR/scripts/deploy.sh"

      - name: SSH 키 삭제
        if: always()
        run: rm -f ~/.ssh/ec2.pem
