# 대구 안심식당 · 주차장 지도 - 운영 배포용
#   실행:  docker compose up -d --build
#   필요:  backend/.env (API 키, git 에는 올리지 않음)
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CACHE_DIR: /data
    volumes:
      - ./data:/data # 주소->좌표 캐시 (컨테이너를 다시 만들어도 유지)
    restart: unless-stopped
    mem_limit: 256m

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80" # 서버에서 다른 앱이 80번을 쓰면 WEB_PORT 로 변경
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 64m
